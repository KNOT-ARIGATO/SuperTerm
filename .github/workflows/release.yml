# Push a tag like v1.2.0 (or v1.2.0-beta.1 for the Beta channel)  →  GitHub runs
# the tests, builds SuperTerm.exe on Windows, self-tests it, optionally signs it,
# and publishes it (plus a SHA-256 file) as a Release.
# The built-in updater of SuperTerm downloads exactly these two files.
name: Build & release SuperTerm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # manual run = build only (artifact), no release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional code signing: add these two repository secrets to sign the exe
      #   SIGN_PFX_BASE64   = base64 of your .pfx code-signing certificate
      #   SIGN_PFX_PASSWORD = its password
      SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "APP_VERSION is $v but the tag is ${{ github.ref_name }}" }

      - name: Install
        run: python -m pip install -r requirements-build.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build SuperTerm.exe
        shell: pwsh
        run: ./build.ps1

      - name: Sign the exe (only when a certificate is configured)
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist/SuperTerm.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process dist/SuperTerm.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:APPDATA/SuperTerm/selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/SuperTerm.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SuperTerm.exe" | Out-File -Encoding ascii dist/SuperTerm.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: SuperTerm
          path: |
            dist/SuperTerm.exe
            dist/SuperTerm.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SuperTerm.exe
            dist/SuperTerm.exe.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
